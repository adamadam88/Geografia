<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Capitals de la UE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Layout: tabs on top; map beside a study/quiz panel on wide screens, stacked on narrow ones; a reference table as the last tab. */
  :root {
    --bg: #EDF0F4;
    --surface: #FFFFFF;
    --ink: #16202B;
    --muted: #5B6877;
    --line: #D3D9E1;
    --accent: #0B6E99;
    --accent-ink: #FFFFFF;
    --good: #1E7F4F;
    --good-bg: #E3F3EA;
    --bad: #B3261E;
    --bad-bg: #FBE4E2;
    --sea: #DCEAF4;
    --land: #E4E2DA;
    --halo: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 32, 43, .06), 0 8px 24px rgba(22, 32, 43, .07);
    --font-text: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-title: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161D; --surface: #19222C; --ink: #E7EDF3; --muted: #9BA8B6; --line: #2B3744;
      --accent: #5BB6E0; --accent-ink: #06202E; --good: #6FD09B; --good-bg: #17301F;
      --bad: #F2918A; --bad-bg: #3A1B19; --sea: #1B2A38; --land: #2B333C; --halo: #10161D;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161D; --surface: #19222C; --ink: #E7EDF3; --muted: #9BA8B6; --line: #2B3744;
    --accent: #5BB6E0; --accent-ink: #06202E; --good: #6FD09B; --good-bg: #17301F;
    --bad: #F2918A; --bad-bg: #3A1B19; --sea: #1B2A38; --land: #2B333C; --halo: #10161D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 16px; line-height: 1.5;
    padding-block: 22px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--font-title); font-weight: 600; font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab, .chip, .btn {
    font-family: var(--font-text); cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .tab { font-size: 16px; font-weight: 600; min-height: 44px; padding: 0 18px; border-radius: 99px; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip { font-size: 14.5px; font-weight: 500; min-height: 38px; padding: 0 14px; border-radius: 99px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn { font-size: 16.5px; font-weight: 600; min-height: 50px; padding: 0 18px; border-radius: 12px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab:focus-visible, .chip:focus-visible, .btn:focus-visible, .opt:focus-visible, .pick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }

  .layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); align-items: start; } }

  .mapbox { display: grid; gap: 10px; min-width: 0; }
  .mapwrap { background: var(--sea); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .mapwrap svg { display: block; width: 100%; min-width: 560px; height: auto; }
  #msg { padding: 28px 20px; color: var(--ink); min-height: 200px; }
  .maptools { display: flex; flex-wrap: wrap; gap: 8px; }
  .zones { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); }
  .zones span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }

  /* Map layers */
  .sea { fill: var(--sea); }
  .cty { stroke: var(--halo); stroke-width: .7; stroke-linejoin: round; transition: opacity .2s; }
  .cty.non { fill: var(--land); }
  .hit { fill: transparent; stroke: none; }
  .has-sel .cty:not(.sel) { opacity: .4; }
  .cty.sel { stroke: var(--ink); stroke-width: 2.4; }
  .cty.ok { stroke: var(--good); stroke-width: 3.4; opacity: 1; }
  .cty.bad { stroke: var(--bad); stroke-width: 3.4; opacity: 1; }
  .cty.eu { cursor: pointer; }
  .nm, .cn { font-family: var(--font-text); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 2.6px; stroke-linejoin: round; pointer-events: none; }
  .nm { font-size: 11.5px; font-weight: 600; letter-spacing: .6px; text-anchor: middle; }
  .nm.non { font-size: 10.5px; font-weight: 500; fill: var(--muted); }
  .cn { font-size: 13px; font-weight: 600; }
  .hide-names .nm { display: none; }
  .cap { display: none; pointer-events: none; }
  .mode-study .cap, .cap.show { display: inline; }
  .cap .cn { display: none; }
  .mode-study:not(.hide-caps) .cap .cn, .cap.named .cn { display: inline; }
  .dot { fill: var(--ink); stroke: var(--halo); stroke-width: 1; }
  .ring { fill: none; stroke-width: 3; display: none; }
  .cap.sel .ring { display: inline; stroke: var(--accent); }
  .cap.ok .ring { display: inline; stroke: var(--good); }
  .cap.bad .ring { display: inline; stroke: var(--bad); }
  .clickmark { fill: var(--bad); stroke: var(--halo); stroke-width: 1.5; }

  .panel { display: grid; gap: 12px; min-width: 0; align-content: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 10px; }
  .card h2 { font-family: var(--font-title); font-weight: 600; font-size: 26px; line-height: 1.2; margin: 0; display: flex; align-items: center; gap: 10px; }
  .card p { margin: 0; }
  .zone { font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .capline { font-family: var(--font-title); font-size: 22px; font-weight: 600; }
  .lbl { color: var(--muted); font-size: 13.5px; font-weight: 600; margin: 0; }
  .nota { background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  .hint { color: var(--muted); }

  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .pick { display: flex; align-items: center; gap: 8px; text-align: left; font: 500 15px/1.2 var(--font-text); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; padding: 6px 10px; cursor: pointer; }
  .pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  .rowchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .counts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counts .main { color: var(--ink); font-weight: 600; margin-right: auto; }
  .q { font-family: var(--font-title); font-weight: 600; font-size: clamp(22px, 3.4vw, 28px); line-height: 1.3; margin: 0; text-wrap: balance; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .opts { grid-template-columns: 1fr; } }
  .opt { font: 600 17px/1.2 var(--font-text); min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .opt.ok { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .opt:disabled { opacity: 1; cursor: default; }
  .opt:disabled:not(.ok):not(.bad) { opacity: .5; }
  .fb { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); }
  .fb.ok { background: var(--good-bg); border-color: var(--good); }
  .fb.bad { background: var(--bad-bg); border-color: var(--bad); }
  .done ul { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 15px; }
  th, td { text-align: left; padding: 8px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 13.5px; color: var(--muted); font-weight: 600; background: var(--bg); }
  tr.zrow td { background: var(--bg); font-weight: 600; }
  td.c1 { font-weight: 600; white-space: nowrap; }
  td.cap1 { font-family: var(--font-title); font-weight: 600; white-space: nowrap; }
  .foot { color: var(--muted); font-size: 13.5px; margin: 0; }

  @media (prefers-reduced-motion: reduce) { .cty { transition: none; } }
</style>

</head>
<body>
<main class="app">
  <header>
    <h1>Capitals de la UE</h1>
    <p class="sub">Els 27 països membres amb la seva capital i on són. Estudia-ho al mapa i comprova què en saps.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" type="button" data-mode="study" aria-selected="true">Estudiar</button>
    <button class="tab" role="tab" type="button" data-mode="capq" aria-selected="false">Preguntes</button>
    <button class="tab" role="tab" type="button" data-mode="locate" aria-selected="false">Situa-ho</button>
    <button class="tab" role="tab" type="button" data-mode="list" aria-selected="false">Llista</button>
  </nav>

  <div class="layout" id="layout">
    <section class="mapbox">
      <div class="mapwrap"><div id="map"><div id="msg">Carregant el mapa…</div></div></div>
      <div class="maptools" id="maptools">
        <button class="chip" id="tNames" type="button" aria-pressed="true">Noms dels països</button>
        <button class="chip" id="tCaps" type="button" aria-pressed="true">Noms de les capitals</button>
      </div>
      <div class="zones" id="zones"></div>
      <p class="foot">Fronteres simplificades. Són els 27 països de la UE actual: el Regne Unit va sortir el 2020.</p>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section id="listView" hidden>
    <div class="tablewrap"><table id="tbl"></table></div>
  </section>
</main>

    } else {
      var best = null, bd = 1e9;
      C.forEach(function (k) {
        if (!k.xy) return;
        var d = Math.hypot(k.xy[0] - p.x, k.xy[1] - p.y);
        if (d < bd) { bd = d; best = k; }
      });
      ok = !!best && best.id === id && bd <= 45;
      R.click = { x: p.x, y: p.y };
      if (ok) text = "Correcte. " + cap + " és " + c.cloc;
      else {
        var near = best && best.id !== id && bd <= 45 ? best : null;
        text = "No és aquí." + (near ? " Això és a prop de " + near.cap + "." : "") + " " + cap + " és " + c.cloc;
      }
    }
    R.answered = true;
    record(id, ok);
    R.fb = { ok: ok, text: text };
    showMode();
  }

  /* Llista */
  function buildList() {
    var t = $("tbl");
    t.textContent = "";
    t.appendChild(h("thead", null, h("tr", null,
      h("th", { text: "País" }), h("th", { text: "Capital" }), h("th", { text: "On és" }), h("th", { text: "Limita amb" }))));
    var body = h("tbody");
    ZONES.forEach(function (z) {
      body.appendChild(h("tr", { class: "zrow" }, h("td", { colspan: "4" },
        h("span", { class: "sw", style: "background:" + REG[z].c + ";margin-right:8px" }), REG[z].n)));
      C.filter(function (c) { return c.z === z; })
        .sort(function (a, b) { return a.n.localeCompare(b.n, "ca"); })
        .forEach(function (c) {
          body.appendChild(h("tr", null,
            h("td", { class: "c1", text: c.n }),
            h("td", { class: "cap1", text: c.cap.charAt(0).toUpperCase() + c.cap.slice(1) }),
            h("td", { text: c.loc + " La capital és " + c.cloc }),
            h("td", { text: c.lim })));
        });
    });
    t.appendChild(body);
  }

  /* ---------- Inici ---------- */
  $("zones").appendChild(document.createDocumentFragment());
  ZONES.forEach(function (z) {
    $("zones").appendChild(h("span", null, h("i", { class: "sw", style: "background:" + REG[z].c }), REG[z].n));
  });
  buildList();
  var tabEls = document.querySelectorAll(".tab");
  for (var ti = 0; ti < tabEls.length; ti++) {
    (function (el) { el.addEventListener("click", function () { enter(el.getAttribute("data-mode")); }); })(tabEls[ti]);
  }
  $("tNames").addEventListener("click", function () {
    showNames = !showNames; $("tNames").setAttribute("aria-pressed", String(showNames)); if (map) map.setNames(showNames);
  });
  $("tCaps").addEventListener("click", function () {
    showCaps = !showCaps; $("tCaps").setAttribute("aria-pressed", String(showCaps)); if (map) map.setCaps(showCaps);
  });
  showMode();
})();
</script>
</body>
</html>
